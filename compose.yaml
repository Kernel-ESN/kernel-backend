# Base locale. Les valeurs viennent de .env (copier .env.example).
services:
  postgres:
    image: docker.io/library/postgres:18-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-plateforme}
      POSTGRES_USER: ${DB_USER:-plateforme}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Definir DB_PASSWORD dans .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - plateforme-db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-plateforme} -d ${DB_NAME:-plateforme}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  plateforme-db:
